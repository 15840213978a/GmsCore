name: 发布 GmsCore 版本

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: '版本号，如 25.24.32；留空自动生成'
        required: false
        type: string
  push:
    tags:
      - 'gmscore-v*'

permissions:
  contents: read

jobs:
  publish:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          df -h

      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
          build-scan-terms-of-use-agree: 'yes'

      - name: 构建 Release APK
        run: ./gradlew assembleRelease

      - name: 检查 Release 构建
        run: ./gradlew lintRelease

      - name: 收集 GmsCore 和 vending-app 的 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          for module in play-services-core vending-app; do
            found=0
            while IFS= read -r -d '' apk; do
              relative="${apk#${module}/build/outputs/apk/}"
              variant="${relative%/*}"
              asset="${module}-${variant//\//-}-${apk##*/}"
              cp "$apk" "release-apks/$asset"
              found=$((found + 1))
            done < <(find "$module/build/outputs/apk" -type f -path '*/release/*.apk' -print0)
            (( found > 0 )) || { echo "No Release APKs found for $module" >&2; exit 1; }
          done
          ls -lh release-apks/*.apk

      - name: 保存构建附件
        uses: actions/upload-artifact@v4
        with:
          name: gmscore-release-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: 确定版本标签
        id: release_tag
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version: $REQUESTED_VERSION" >&2; exit 1; }
            tag="gmscore-v$REQUESTED_VERSION"
          else
            version="$(sed -nE 's/^[[:space:]]*def gmsVersion = "([^"]+)".*/\1/p' build.gradle | head -n 1)"
            [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Invalid GmsCore version: $version" >&2; exit 1; }
            tag="gmscore-v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            本次 Release APK 尚未签名。安装或后续更新前，请使用同一把持久密钥自行签名。
          files: release-apks/*.apk
